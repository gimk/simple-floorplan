# Cloudflare Worker + Static Assets: the Worker in functions/worker.ts serves /api/*,
# everything else is served from the ./dist static assets build.
name = "simple-floorplan"
main = "functions/worker.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "simple-floorplan"
database_id = "d550597a-3646-4324-8959-8fcfa741cd1c"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "simple-floorplan-images"

# Optional secret: npx wrangler secret put API_TOKEN
# If API_TOKEN is unset, the API allows all requests.

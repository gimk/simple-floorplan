# Cloudflare Worker: serves the built SPA from dist/ (ASSETS binding) and the Hono
# API from functions/app.ts behind /api/*. See functions/README.md for setup.
name = "simple-floorplan"
main = "functions/worker.ts"
compatibility_date = "2025-06-01"

# Static assets: the Vite build output. The assets layer serves every file in dist/,
# and single-page-application handling gives unknown paths index.html so the client
# router can take over. API requests reach the Worker first (run_worker_first).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 (SQLite) database.
[[d1_databases]]
binding = "DB"
database_name = "simple-floorplan"
database_id = "d550597a-3646-4324-8959-8fcfa741cd1c"

# R2 bucket for background plan images.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "simple-floorplan-images"

# Hard cost caps for R2 uploads (see "Cost safety" in functions/README.md).
# Values are strings: the API parses them and falls back to the defaults when a
# value is missing or not a positive number.
[vars]
MAX_UPLOAD_MB = "10"
MAX_R2_TOTAL_MB = "5000"
MAX_UPLOADS_PER_DAY = "200"

# Secrets (not in this file):
#   wrangler secret put PASSCODE
# If PASSCODE is unset, the API allows all requests.
